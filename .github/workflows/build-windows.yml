name: Build Windows client

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: client/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r client/requirements.txt
          python -m pip install "pyinstaller>=6.10,<7"

      - name: Restore application icon
        shell: pwsh
        run: |
          $encoded = Get-Content client/queuepop_notifier.ico.b64 -Raw
          [IO.File]::WriteAllBytes("client/queuepop_notifier.ico", [Convert]::FromBase64String($encoded.Trim()))

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name QueuePopNotifier `
            --icon client/queuepop_notifier.ico `
            --add-data "client/queuepop_notifier.ico;." `
            client/queuepop_companion.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: QueuePopNotifier_Client_v0.3.30_Windows
          path: dist/QueuePopNotifier.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish executable in repository
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force builds/windows | Out-Null
          Copy-Item dist/QueuePopNotifier.exe builds/windows/QueuePopNotifier.exe -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/windows/QueuePopNotifier.exe
          if (git diff --cached --quiet) {
            Write-Host "Executable is unchanged."
          } else {
            git commit -m "Build Windows client 0.3.30"
            git push
          }
