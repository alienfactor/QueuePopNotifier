name: Release Windows client 0.4.0

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".service_icons/**"
      - ".service_icon_patch.py"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply corrected service icons
        run: |
          python .service_icon_patch.py
          python -m py_compile client/queuepop_companion.py

      - name: Restore application icon
        shell: pwsh
        run: |
          $encoded = Get-Content client/queuepop_notifier.ico.b64 -Raw
          [IO.File]::WriteAllBytes("client/queuepop_notifier.ico", [Convert]::FromBase64String($encoded.Trim()))

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r client/requirements.txt
          pip install pyinstaller

      - name: Verify service icons through ImageTk
        shell: pwsh
        run: |
          @'
          import base64
          import importlib.util
          import io
          import tkinter as tk
          from pathlib import Path
          from PIL import Image, ImageTk

          source = Path("client/queuepop_companion.py")
          spec = importlib.util.spec_from_file_location("queuepop_companion", source)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          root = tk.Tk()
          root.withdraw()
          try:
              for name in ("PUSHOVER_SERVICE_ICON_B64", "NTFY_SERVICE_ICON_B64", "TELEGRAM_SERVICE_ICON_B64"):
                  encoded = "".join(getattr(module, name).split())
                  raw = base64.b64decode(encoded, validate=True)
                  with Image.open(io.BytesIO(raw)) as source_image:
                      image = source_image.convert("RGBA")
                  image.thumbnail((42, 42), Image.LANCZOS)
                  photo = ImageTk.PhotoImage(image, master=root)
                  if photo.width() <= 0 or photo.height() <= 0:
                      raise RuntimeError(f"{name}: ImageTk returned an empty image")
                  print(f"{name}: ImageTk OK ({photo.width()}x{photo.height()})")
          finally:
              root.destroy()
          '@ | Set-Content .verify_service_icons.py -Encoding utf8
          python .verify_service_icons.py
          Remove-Item .verify_service_icons.py -Force

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name QueuePopNotifier `
            --icon client/queuepop_notifier.ico `
            --add-data "client/queuepop_notifier.ico;." `
            --hidden-import PIL._imagingtk `
            --exclude-module PIL._avif `
            --exclude-module PIL._webp `
            --exclude-module PIL._imagingcms `
            --exclude-module PIL._imagingmath `
            client/queuepop_companion.py

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/QueuePopNotifier.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  QueuePopNotifier.exe" | Set-Content -NoNewline -Encoding ascii dist/QueuePopNotifier.exe.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QueuePopNotifier_Client_v0.4.0_Windows
          path: |
            dist/QueuePopNotifier.exe
            dist/QueuePopNotifier.exe.sha256

      - name: Copy build into repository
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force builds/windows | Out-Null
          Copy-Item dist/QueuePopNotifier.exe builds/windows/QueuePopNotifier.exe -Force
          Copy-Item dist/QueuePopNotifier.exe.sha256 builds/windows/QueuePopNotifier.exe.sha256 -Force

      - name: Commit release files
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/queuepop_companion.py builds/windows/QueuePopNotifier.exe builds/windows/QueuePopNotifier.exe.sha256
          if (-not (git diff --cached --quiet)) {
            git commit -m "Build Windows client 0.4.0 with working service icons [skip ci]"
            git push
          }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.4.0"
          $title = "Queue Pop Notifier 0.4.0"
          $notes = @'
          Queue Pop Notifier sends an instant notification to your phone when a PvE or PvP queue becomes ready in World of Warcraft: Mists of Pandaria Classic—so you can step away from your PC without missing the invite.

          ## Highlights

          - Instant notifications for PvE and PvP queue pops
          - Fast queue detection
          - Automatic client updates
          - German and English interface
          - Compact Windows tray application
          - Multiple notification services

          ## Changes in 0.4.0

          - Added ntfy and Telegram as notification providers alongside Pushover.
          - Added provider-specific setup and connection testing.
          - Updated the settings interface for selecting and configuring the active notification service.
          - Corrected the Pushover, ntfy and Telegram service icons.

          ## Installation

          1. Download `QueuePopNotifier.exe` below.
          2. Start the client and configure one supported notification service.
          3. Keep the WoW addon enabled while playing.

          Existing installations receive this version automatically.

          ## Requirements

          - Windows 10 or Windows 11
          - Queue Pop Notifier WoW addon
          - Pushover, ntfy, or Telegram for smartphone notifications
          '@
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title $title --notes $notes
            gh release upload $tag dist/QueuePopNotifier.exe dist/QueuePopNotifier.exe.sha256 --clobber
          } else {
            gh release create $tag dist/QueuePopNotifier.exe dist/QueuePopNotifier.exe.sha256 --title $title --notes $notes
          }
