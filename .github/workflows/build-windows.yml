name: Build Windows client

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore application icon
        shell: pwsh
        run: |
          $encoded = Get-Content client/queuepop_notifier.ico.b64 -Raw
          [IO.File]::WriteAllBytes("client/queuepop_notifier.ico", [Convert]::FromBase64String($encoded.Trim()))

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r client/requirements.txt
          pip install pyinstaller

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name QueuePopNotifier `
            --icon client/queuepop_notifier.ico `
            --add-data "client/queuepop_notifier.ico;." `
            --exclude-module PIL._avif `
            --exclude-module PIL._webp `
            --exclude-module PIL._imagingcms `
            --exclude-module PIL._imagingmath `
            --exclude-module PIL._imagingtk `
            client/queuepop_companion.py

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/QueuePopNotifier.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  QueuePopNotifier.exe" | Set-Content -NoNewline -Encoding ascii dist/QueuePopNotifier.exe.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QueuePopNotifier_Client_v0.3.52_Windows
          path: |
            dist/QueuePopNotifier.exe
            dist/QueuePopNotifier.exe.sha256

      - name: Copy build into repository
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force builds/windows | Out-Null
          Copy-Item dist/QueuePopNotifier.exe builds/windows/QueuePopNotifier.exe -Force
          Copy-Item dist/QueuePopNotifier.exe.sha256 builds/windows/QueuePopNotifier.exe.sha256 -Force

      - name: Commit compiled executable
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/windows/QueuePopNotifier.exe builds/windows/QueuePopNotifier.exe.sha256
          if (-not (git diff --cached --quiet)) {
            git commit -m "Build Windows client 0.3.52"
            git push
          }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.3.52"
          $title = "Queue Pop Notifier 0.3.52"
          $notes = @'
          Queue Pop Notifier sends an instant notification to your phone when a PvE or PvP queue becomes ready in World of Warcraft: Mists of Pandaria Classic—so you can step away from your PC without missing the invite.

          ## Highlights

          - Instant notifications for PvE and PvP queue pops
          - Alerts when a failed proposal places you back into the queue
          - Fast detection, typically within less than one second
          - Automatic client updates
          - German and English interface
          - Compact tray application with no intrusive update popups

          ## Changes in 0.3.52

          - Redesigned the **General** section to use the available width more effectively.
          - Added clear descriptions for the language and Windows startup settings.
          - Aligned setting titles and descriptions consistently on the left.
          - Kept the language selector and startup control neatly aligned on the right.

          ## Installation

          1. Download `QueuePopNotifier.exe` below.
          2. Start the client and enter your Pushover User Key and App/API Token.
          3. Keep the WoW addon enabled while playing.

          Existing installations receive this version automatically.

          ## Requirements

          - Windows 10 or Windows 11
          - Queue Pop Notifier WoW addon
          - Pushover account
          '@
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/QueuePopNotifier.exe dist/QueuePopNotifier.exe.sha256 --clobber
          } else {
            gh release create $tag dist/QueuePopNotifier.exe dist/QueuePopNotifier.exe.sha256 --title $title --notes $notes
          }
