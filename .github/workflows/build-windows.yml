name: Build Windows client

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: client/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r client/requirements.txt
          python -m pip install "pyinstaller>=6.10,<7"

      - name: Restore application icon
        shell: pwsh
        run: |
          $encoded = Get-Content client/queuepop_notifier.ico.b64 -Raw
          [IO.File]::WriteAllBytes("client/queuepop_notifier.ico", [Convert]::FromBase64String($encoded.Trim()))

      - name: Build executable and checksum
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name QueuePopNotifier `
            --icon client/queuepop_notifier.ico `
            --add-data "client/queuepop_notifier.ico;." `
            client/queuepop_companion.py
          $hash = (Get-FileHash dist/QueuePopNotifier.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  QueuePopNotifier.exe" | Set-Content dist/QueuePopNotifier.exe.sha256 -Encoding ascii

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QueuePopNotifier_Client_v0.3.34_Windows
          path: |
            dist/QueuePopNotifier.exe
            dist/QueuePopNotifier.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish executable in repository
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force builds/windows | Out-Null
          Copy-Item dist/QueuePopNotifier.exe builds/windows/QueuePopNotifier.exe -Force
          Copy-Item dist/QueuePopNotifier.exe.sha256 builds/windows/QueuePopNotifier.exe.sha256 -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/windows/QueuePopNotifier.exe builds/windows/QueuePopNotifier.exe.sha256
          if (git diff --cached --quiet) {
            Write-Host "Build output is unchanged."
          } else {
            git commit -m "Build Windows client 0.3.34"
            git push
          }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.3.34"
          $title = "Queue Pop Notifier 0.3.34"
          $notes = @"
          ## Changes

          - Added an optional per-user Windows startup setting.
          - Updates continue to install automatically and quietly at application startup.
          - Added SHA-256 verification for automatic update downloads.
          "@
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/QueuePopNotifier.exe dist/QueuePopNotifier.exe.sha256 --clobber
          } else {
            gh release create $tag dist/QueuePopNotifier.exe dist/QueuePopNotifier.exe.sha256 --title $title --notes $notes --target "${{ github.sha }}"
          }
